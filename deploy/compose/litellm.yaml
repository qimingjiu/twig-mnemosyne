# litellm.yaml（compose 挂载为 /app/config.yaml）— §6.2 + §6.4（Model Gateway = 管道；路由决策在 Mnemosyne TS 侧，§6.3）
#
# 缓存决策（2026-09-03 R4）：故意不配 litellm_settings.cache。
# - response cache 的键含全量 messages：对话流量逐轮漂移，命中率≈0，只占 Redis；
# - redis-semantic 有跨话题误匹配（BerriAI/litellm#12234），陪伴场景答错代价不可接受；
# - 省钱主战场是厂商原生前缀缓存（Kimi/DeepSeek 自动、Anthropic cache_control），
#   由 Runtime 装配顺序保证（builder.ts stable→volatile），用 usage_logs.cache_read_tokens 观测。
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 400

  # DeepSeek 条目 2026-09-01 起统一指 v4-flash-vision-exp（识图版）；与 deploy/litellm/config.yaml 保持同步
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-v4-flash-vision-exp
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 1000

  # Agent 路由层小模型（§6.4 deepseek-flash）
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash-vision-exp
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 1000

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
      rpm: 360

  # ── OpenAI 兼容中转（同一把 key 可挂多个模型条目；与 deploy/litellm/config.yaml 保持同步）──

  # CommandCode 中转 · Gemini 3.7 Flash（套餐内）
  - model_name: gemini-3.7-flash
    litellm_params:
      model: openai/google/gemini-3.7-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  # CommandCode 中转 · 2026-09-01 批量接入（API 模型名逐字对照 CommandCode 文档，勿改大小写/分隔符）
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  - model_name: grok-4.5
    litellm_params:
      model: openai/xai/grok-4.5
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  - model_name: grok-4.6
    litellm_params:
      model: openai/xai/grok-4.6
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  - model_name: kimi-k2.5
    litellm_params:
      model: openai/moonshotai/Kimi-K2.5
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  - model_name: glm-5.2-fast
    litellm_params:
      model: openai/zai-org/GLM-5.2-Fast
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  # GLM-5.3 双条目：上游 org 前缀不同（zai-org vs z-ai），逐字勿混；文档 v0826 漏了 5.3，经账号 /models 核实
  - model_name: glm-5.3
    litellm_params:
      model: openai/zai-org/GLM-5.3
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/z-ai/glm-5.3-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: os.environ/COMMANDCODE_API_KEY

  # ── Moonshot 官方 API（OpenAI 兼容）──
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      rpm: 300

  - model_name: kimi-k2.7-code
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      rpm: 300

  - model_name: kimi-k2.7-code-highspeed
    litellm_params:
      model: openai/kimi-k2.7-code-highspeed
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      rpm: 300

  - model_name: kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      rpm: 300

  # OpenCode Zen · GPT 5.6 Luna
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY

  # 硅基流动 · GLM-5.2
  - model_name: glm-5.2
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY

  # FEATURE-02 本地 lane（§20）：形态 A 时 OLLAMA_API_BASE 指向 tailnet IP
  - model_name: ollama/qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE
      api_key: ollama

router_settings:
  routing_strategy: simple-shuffle
  # fallbacks 须为 {模型组: [备选…]} 字典列表——原 fallback_strategy（裸字符串列表）不是
  # litellm 认识的键，整段被静默忽略，等于从未配置过 fallback
  fallbacks:
    - gpt-4o: ["claude-sonnet", "gemini-pro"]
    - claude-sonnet: ["gemini-pro"]
  cooldown_time: 60
  num_retries: 2
  timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
